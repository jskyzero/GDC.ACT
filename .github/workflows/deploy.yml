name: Deploy Slidev ACT

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [trigger-build]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取主博客资源
        uses: actions/checkout@v4
        with:
          repository: 'jskyzero/design.jskyzero.com'
          path: 'design.jskyzero.com'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'
          # 不要在这里写 cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          # npm 缓存目录在 Linux 上的默认路径
          path: ~/.npm
          # 使用 package.json 的哈希值作为缓存 Key
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('package.json') }}
          # 如果 key 没命中，尝试恢复最近的缓存
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install dependencies
        # 即使没有 lock 文件，npm 也会尝试从 ~/.npm 缓存中读取包
        run: npm install

      - name: 准备资源并构建
        env:
          SOURCE_DIR: "./design.jskyzero.com"
        run: |
          chmod +x move.sh
          ./move.sh
          npm run build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: act.jsky.wiki